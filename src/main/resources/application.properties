spring.application.name=Prod-Ready-Features

spring.datasource.url=jdbc:mysql://localhost:3306/prod_ready_features
spring.datasource.username=root
spring.datasource.password=Root
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.devtools.restart.enabled=true
spring.devtools.restart.exclude=com/Codingbrajmohan/Prod_Ready_Features/dto/**

server.port=9000

employeeService.base.url=http://localhost:8080/

# logging configuration (Fixed slashes to dots, and fixed date format)
logging.level.com.Codingbrajmohan.Prod_Ready_Features.clients=trace
logging.level.com.Codingbrajmohan.Prod_Ready_Features.config=INFO
logging.pattern.console=%d{dd-MM-yyyy HH:mm:ss} [%level] %c{1.} --- %m%n
logging.file.name=application.log
logging.config=classpath:logback-spring.xml

# actuator configuration
management.endpoints.web.exposure.include=*
management.info.env.enabled=true
info.app.author=Brajmohan
info.app.version=1.0.0
info.app.documentation=https://codingbrajmohan.com/docs
management.endpoint.env.show-values=always
management.info.build.enabled=true
management.info.git.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# open api doc configuration
springdoc.api-docs.enabled=true